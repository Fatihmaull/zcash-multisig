<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B16B" />
      <stop offset="100%" stop-color="#A87428" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
  </defs>

  <!-- Modern rounded background tile for favicon visibility on all browser tabs -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="rgba(226, 177, 107, 0.25)" stroke-width="1.5" />

  <!-- Distinctive 'Q' Glyph from Quorum Fi -->
  <circle cx="28" cy="28" r="15" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  
  <!-- Signature tail hook of Q -->
  <path 
    d="M 32 38 C 34 44, 28 48, 23 46" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="4.5" 
    stroke-linecap="round" 
  />

  <!-- 'Fi' gold accent symbol -->
  <circle cx="48" cy="19" r="3.5" fill="url(#fiGradient)" />
  <path d="M 44 26 H 52 M 48 26 V 42" stroke="url(#fiGradient)" stroke-width="4" stroke-linecap="round" />
</svg>
