# ──────────────────────────────────────────────────────────────
# Quorum — Docker Compose (Dev Environment)
#
# Services:
#   postgres  — application metadata (zero-custody, NO key material)
#   zebra     — Zcash testnet node (placeholder, activate after P0-B1)
#   zaino     — Zcash indexer (placeholder, activate after P0-B1)
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quorum-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quorum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quorum_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quorum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorum}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Zebra — Zcash Testnet Node ──────────────────────────────
