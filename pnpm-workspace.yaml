packages:
  - "apps/*"

# Canonical pnpm 10 syntax. Previously written as an `allowBuilds:` map, which
# the installer reads as `onlyBuiltDependencies` and expects to be a list —
# it failed with "onlyBuiltDependencies?.sort is not a function" in CI.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - unrs-resolver
