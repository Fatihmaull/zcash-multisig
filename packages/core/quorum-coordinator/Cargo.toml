[package]
name = "quorum-coordinator"
version = "0.1.0"
edition = "2021"
description = "FROST coordinator — PCZT assembly, share aggregation, broadcast"

[[bin]]
name = "quorum-coordinatord"
path = "src/bin/coordinatord.rs"

[lib]
name = "quorum_coordinator"
path = "src/lib.rs"

[dependencies]
quorum-core = { path = "../quorum-core" }
frost-core.workspace = true
frost-rerandomized.workspace = true
reddsa.workspace = true
hex.workspace = true
pczt = { workspace = true, features = ["orchard", "signer", "spend-finalizer", "tx-extractor"] }
orchard.workspace = true
ff.workspace = true
quorum-signer = { path = "../quorum-signer" }
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand = "0.8"
zcash_protocol = "0.10"
zcash_keys.workspace = true
anyhow.workspace = true
thiserror.workspace = true
[dev-dependencies]
quorum-signer = { path = "../quorum-signer" }
tower = "0.5"
rand.workspace = true
pasta_curves.workspace = true
ff.workspace = true
orchard.workspace = true
