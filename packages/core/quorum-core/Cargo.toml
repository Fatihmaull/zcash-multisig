[package]
name = "quorum-core"
version = "0.1.0"
edition = "2021"
description = "FROST wrapper types and DKG orchestration for Quorum"

[dependencies]
# Ciphersuite — RedPallas. See the workspace Cargo.toml for why the
# `frost` feature and the direct frost-rerandomized dependency are both
# required, and why frost-ed25519 must never appear here.
reddsa.workspace = true
frost-rerandomized.workspace = true
frost-core.workspace = true
orchard.workspace = true
# `signer` for the sighash, `orchard` for the bundles. No spend-finalizer or
# tx-extractor: reading a transaction is shared, writing one is not, and a
# signer has no business being able to finalise anything.
pczt = { workspace = true, features = ["orchard", "signer"] }
pasta_curves.workspace = true
ff.workspace = true
zcash_keys.workspace = true
zcash_address.workspace = true
zcash_protocol = "0.10"
zip32 = "0.2"

rand_core = "0.6"
snow.workspace = true
x25519-dalek.workspace = true
xeddsa.workspace = true
uuid.workspace = true
reqwest.workspace = true
hex.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rand.workspace = true
tokio.workspace = true
pasta_curves.workspace = true
ff.workspace = true
