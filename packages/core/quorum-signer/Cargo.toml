[package]
name = "quorum-signer"
version = "0.1.0"
edition = "2021"
description = "Participant signer binary — holds shares, performs FROST rounds"

[[bin]]
name = "quorum-signerd"
path = "src/bin/signerd.rs"

# The distributed key ceremony. Separate from signerd on purpose: it runs
# once, produces the share signerd later consumes, and has no business
# sharing a process with the thing that holds the share day to day.
[[bin]]
name = "quorum-dkgd"
path = "src/bin/dkgd.rs"

[lib]
name = "quorum_signer"
path = "src/lib.rs"

[dependencies]
quorum-core = { path = "../quorum-core" }
frost-core.workspace = true
frost-rerandomized.workspace = true
reddsa.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
rand_core = "0.6"
thiserror.workspace = true
hex.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand = "0.8"
# The ceremony derives the vault address so every participant can confirm
# they built the same vault before anyone writes a share.
zcash_keys.workspace = true
zcash_protocol = "0.10"

[dev-dependencies]
rand.workspace = true
hex.workspace = true
serde_json.workspace = true
pasta_curves.workspace = true
ff.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
# The mock relay the ceremony test runs against — frostd's wire protocol,
# none of frostd.
axum.workspace = true
uuid.workspace = true
