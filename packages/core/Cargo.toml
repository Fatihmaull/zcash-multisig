[workspace]
resolver = "2"
members = [
    "quorum-core",
    "quorum-signer",
    "quorum-coordinator",
]

# ──────────────────────────────────────────────────────────────
# Pinned dependency versions — DO NOT chase upstream mid-hackathon.
# See docs/04-technical-constraints.md §C7.
# ──────────────────────────────────────────────────────────────
[workspace.dependencies]

# ── Ciphersuite ───────────────────────────────────────────────
# RedPallas, via reddsa. NEVER frost-ed25519 or any other default
# ciphersuite — see docs/04-technical-constraints.md §C4. A signature
# produced under the wrong ciphersuite is cryptographically valid and
# authorizes nothing on Zcash.
#
# The `frost` feature is required: it gates reddsa::frost::redpallas.
# Without it you get plain RedDSA and no FROST ciphersuite at all.
reddsa = { version = "0.5", features = ["frost"] }

# RandomizedParams lives in frost-rerandomized. reddsa re-exports items
# from frost_rerandomized::frost_core, but NOT frost_rerandomized itself,
# so rerandomized signing needs this as a direct dependency.
#
# NOT COVERED BY THE NCC AUDIT of frost-core. Never describe anything
# built on this as audited. See docs/04-technical-constraints.md §C7.
frost-rerandomized = "3.0.0"

# Pulled transitively by frost-rerandomized; declared explicitly for the
# core types. Must stay at the same version — verify with:
#   cargo tree -i frost-core   (expect exactly one 3.0.0 in the tree)
frost-core = "3.0.0"

# ── Orchard / Ironwood ────────────────────────────────────
# `unstable-frost` exposes SpendValidatingKey::{to_bytes,from_bytes}, which
# is how a FROST group verifying key becomes a Zcash spend validating key.
#
# The git patch below is for ONE function the published crate lacks:
# FullViewingKey::from_sk_ak_...(), needed to derive a vault's viewing key
# from a group key nobody holds the spending key for. Pending
# zcash/orchard#475. frost-zcash-demo carries the same patch.
#
# CAVEAT, and it must reach the submission text: that constructor is named
# for being incompatible with quantum recoverability, which is the property
# Ironwood exists to provide. Whether that costs a vault its future
# post-quantum recovery is an open question with ZF.
# See docs/12-spike-s1-report.md §7.
orchard = { version = "0.15.5", features = ["unstable-frost"] }

# ── Zcash ─────────────────────────────────────────────────────
# Release candidates. Pinned exactly; see §C7. Ironwood/v6 support and
# anchor deferrability are still moving upstream (librustzcash #2467, #2525).
pczt = "=0.8.0-rc.1"
zcash_client_backend = "=0.24.0-rc.1"
# CORRECTED in spike S1. The previous pins (zcash_keys 0.6, zcash_address 0.7)
# did not resolve at all: zcash_address 0.7 depends on core2 0.3.x, every
# version of which is yanked. These are the versions frost-zcash-demo uses and
# that resolve cleanly with pczt 0.8.0-rc.1.
# `unstable-frost` exposes UnifiedFullViewingKey::from_orchard_fvk, which is
# how a FROST vault (Orchard receiver only, no Sapling, no transparent)
# becomes a UFVK a wallet can scan with. Added upstream for exactly this.
zcash_keys = { version = "0.15", features = ["orchard", "sapling", "unstable-frost"] }
zcash_address = "0.13"

# ── frostd transport ──────────────────────────────────────
# We implement our own frostd client. The upstream `frost-client` is not
# published to crates.io and is pinned to frost-core 2.2.0 — depending on it
# would drag a second, incompatible FROST into the tree. frostd itself relays
# opaque bytes, so our v3 types travel over it untouched.
# See docs/13-phase-1-plan.md.
snow = "0.9"        # Noise_K_25519_ChaChaPoly_BLAKE2s, same as frost-client
# Pinned exactly. 1.1.0 moved to rand_core 0.10, which would sit alongside
# the 0.6 frost-core pulls — two RNG traits in one tree, and the signing call
# stops compiling. 1.0.2 is also what frostd's own client uses, so challenge
# signatures are compatible by construction rather than by assumption.
xeddsa = "=1.0.2"
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"

# ── Share storage at rest ─────────────────────────────────
# A key share on a participant's laptop. Argon2id because the only secret
# protecting it is a human-chosen passphrase, and a fast KDF would make that
# passphrase worth guessing.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# ── Coordinator HTTP service ──────────────────────────────
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# ── General ───────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev only — rand 0.8 is the line matching frost-core 3.0.0's rand_core 0.6.
rand = "0.8"
# Dev only — the Pallas scalar type, for standing in as a PCZT action alpha.
# Must match the version orchard pulls.
pasta_curves = "0.5"
ff = "0.13"

[patch.crates-io]
# Remove once zcash/orchard#475 lands. Same rev frost-zcash-demo pins.
orchard = { git = "https://github.com/conradoplg/orchard.git", rev = "42015f15733b95e179189628d6fa34d92b5b3b8b" }
