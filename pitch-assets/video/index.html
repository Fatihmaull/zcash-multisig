<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum — deterministic pitch film</title>
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("./node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("./node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("./node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("./node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("./node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b11; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="film" width="1920" height="1080" aria-label="Quorum pitch film frame"></canvas>
  <script type="module">
    import { PALETTE as C, REFERENCE_DURATION, buildTimeline } from "./timeline.js";
    import { paintScene as paintArt, actBug, actCard } from "./scenes.js";

    const W = 1920;
    const H = 1080;
    const canvas = document.querySelector("#film");
    let ctx = canvas.getContext("2d", { alpha: false, desynchronized: false });
    let duration = REFERENCE_DURATION;
    let scenes = buildTimeline(duration);

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const sans = (size, weight = 600) => `${weight} ${size}px "Plus Jakarta Sans"`;
    const mono = (size, weight = 500) => `${weight} ${size}px "JetBrains Mono"`;

    const SPRINGS = {
      snappy: { w: 26, z: 0.72 },
      default: { w: 16, z: 0.82 },
      heavy: { w: 11, z: 1.0 },
    };
    function spring(elapsed, preset = "default") {
      if (elapsed <= 0) return 0;
      const { w, z } = SPRINGS[preset];
      if (z >= 1) return 1 - (1 + w * elapsed) * Math.exp(-w * elapsed);
      const wd = w * Math.sqrt(1 - z * z);
      return 1 - Math.exp(-z * w * elapsed) * (Math.cos(wd * elapsed) + (z * w / wd) * Math.sin(wd * elapsed));
    }
    const TRANSITION = 0.42;

    function pathRoundRect(x, y, width, height, radius = 18) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function progressRule(time) {
      ctx.fillStyle = C.borderSubtle;
      ctx.fillRect(112, 1020, 1696, 2);
      ctx.fillStyle = C.gold;
      ctx.fillRect(112, 1020, 1696 * clamp(time / duration), 2);
    }

    let captions = [];
    const CAPTION = { font: sans(34, 600), lineHeight: 44, maxWidth: 1480, bottom: 1000, padX: 28, padY: 14 };

    function captionLines(text) {
      ctx.font = CAPTION.font;
      const lines = [];
      let current = "";
      for (const word of text.split(/\s+/)) {
        const test = current ? `${current} ${word}` : word;
        if (current && ctx.measureText(test).width > CAPTION.maxWidth) { lines.push(current); current = word; }
        else current = test;
      }
      if (current) lines.push(current);
      if (lines.length === 2) {
        const all = text.split(/\s+/);
        let best = null;
        for (let i = 1; i < all.length; i += 1) {
          const a = all.slice(0, i).join(" "), b = all.slice(i).join(" ");
          const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
          if (wa > CAPTION.maxWidth || wb > CAPTION.maxWidth) continue;
          if (!best || Math.abs(wa - wb) < best.diff) best = { lines: [a, b], diff: Math.abs(wa - wb) };
        }
        if (best) return best.lines;
      }
      return lines;
    }

    function drawCaption(time) {
      const cue = captions.find((entry) => time >= entry.start && time < entry.end);
      if (!cue) return;
      const lines = captionLines(cue.text);
      ctx.save();
      ctx.font = CAPTION.font;
      const width = Math.max(...lines.map((entry) => ctx.measureText(entry).width));
      const height = lines.length * CAPTION.lineHeight;
      const x = W / 2 - width / 2 - CAPTION.padX;
      const y = CAPTION.bottom - height - CAPTION.padY * 2;
      ctx.globalAlpha = clamp(Math.min(time - cue.start, cue.end - time) / 0.12);
      pathRoundRect(x, y, width + CAPTION.padX * 2, height + CAPTION.padY * 2, 10);
      ctx.fillStyle = "rgba(8,11,17,0.86)";
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = C.border;
      ctx.stroke();
      ctx.fillStyle = C.text;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      lines.forEach((entry, index) => ctx.fillText(entry, W / 2, y + CAPTION.padY + (index + 1) * CAPTION.lineHeight - 12));
      ctx.restore();
    }

    function sceneAt(time) {
      return scenes.find((scene) => time >= scene.start && time < scene.end) ?? scenes[scenes.length - 1];
    }

    const layers = [0, 1].map(() => {
      const surface = document.createElement("canvas");
      surface.width = W;
      surface.height = H;
      return surface;
    });

    function paintScene(surface, scene, local, t) {
      const previous = ctx;
      ctx = surface.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
      paintArt(ctx, scene, local, t);
      ctx = previous;
      return surface;
    }

    function blit(surface, dx, alpha) {
      ctx.save();
      ctx.globalAlpha = clamp(alpha);
      ctx.drawImage(surface, dx, 0);
      ctx.restore();
    }

    window.configureFilm = ({ measuredDuration, vocalOnsets = [], beat = null, acts = null, cues = [] }) => {
      duration = measuredDuration;
      captions = cues;
      scenes = buildTimeline(duration, { vocalOnsets, beatPeriod: beat, acts });
      return scenes;
    };

    window.getFilmState = () => ({ duration, scenes });

    window.seek = (time) => {
      const t = clamp(Number(time) || 0, 0, Math.max(0, duration - 0.0001));
      const index = scenes.indexOf(sceneAt(t));
      const scene = scenes[index];
      const local = t - scene.start;
      const prev = index > 0 ? scenes[index - 1] : null;
      const actChange = prev && prev.beat !== scene.beat;

      if (prev && local < TRANSITION) {
        const outgoing = paintScene(layers[0], prev, prev.end - prev.start, t);
        const incoming = paintScene(layers[1], scene, local, t);
        if (actChange) {
          const edge = W * clamp(spring(local, "heavy") * 1.04);
          blit(outgoing, -60 * spring(local, "default"), 1);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, edge, H);
          ctx.clip();
          blit(incoming, 0, 1);
          ctx.restore();
          ctx.fillStyle = C.gold;
          ctx.fillRect(edge - 14, 0, 14, H);
          ctx.fillStyle = C.goldBorder;
          ctx.fillRect(edge - 64, 0, 36, H);
        } else {
          const out = spring(local, "snappy");
          const inn = spring(local - 0.13, "default");
          if (out < 0.98) blit(outgoing, -200 * out, 1 - out);
          if (inn > 0) blit(incoming, 160 * (1 - inn), clamp(inn * 1.3));
        }
      } else {
        blit(paintScene(layers[1], scene, local, t), 0, 1);
      }

      if (actChange && local < 1.45) {
        actCard(ctx, scene.beat, local);
      }

      drawCaption(t);
      progressRule(t);

      const actStart = scenes.find((s) => s.beat === scene.beat)?.start ?? scene.start;
      const bugK = spring(t - actStart - 0.3, "snappy");
      actBug(ctx, scene.beat, bugK);

      return { scene: scene.id, time: t };
    };

    await Promise.all([
      ...[400, 500, 600, 700, 800].map((weight) => document.fonts.load(`${weight} 34px "Plus Jakarta Sans"`)),
      ...[500, 600, 700, 800].map((weight) => document.fonts.load(`${weight} 20px "JetBrains Mono"`)),
    ]);
    await document.fonts.ready;
    window.seek(0);
    window.__FILM_READY__ = true;
  </script>
</body>
</html>
